# Example Lcoder configuration
# Copy to ~/.lcoder/config.yaml or pass via --config

provider: "openai"
model: "gpt-4o-mini"

tui:
  theme: dark  # or light

# Provider connection layer (optional). Lets Lcoder reach custom
# OpenAI-compatible endpoints (region-specific bases, relays, self-hosted)
# via the in-process engine. {env:VAR} is interpolated from the environment
# at startup. Omit this block to use each provider's default base URL.
# providers:
#   moonshot:                              # Kimi via the China endpoint
#     base_url: "https://api.moonshot.cn/v1"
#     api_key: "{env:MOONSHOT_API_KEY}"
#   dashscope:                             # Qwen
#     api_key: "{env:DASHSCOPE_API_KEY}"
#   myrelay:                               # any OpenAI-compatible relay
#     route: openai                        # ride the openai-compatible protocol
#     base_url: "https://api.relay.com/v1"
#     api_key: "{env:RELAY_KEY}"
#     headers:
#       X-Title: lcoder

# API keys 不写在本文件。优先级:config.providers.<name>.api_key (手写,含 {env:VAR})
#   > ~/.lcoder/credentials.yaml (TUI 写入,0600) > 标准环境变量 (如 OPENAI_API_KEY)。
# credentials.yaml 示例:
#   openai:
#     api_key: sk-...
#   moonshot:
#     api_key: sk-...
#     base_url: https://api.moonshot.cn/v1
# provider 字段可省略 model 的归属:Lcoder 会按 model id 自行解析 provider 并路由。

# TUI 配置:首次启动若当前 provider 无可用 key,会自动弹出向导
# (选 provider -> 选 model -> 输入 api_key);运行中用 /provider 重新配置或切换模型。
# 向导写入的 api_key 保存到 ~/.lcoder/credentials.yaml(0600);切换的 model 立即对
# 当前会话生效(重启后仍以本文件的 provider/model 为默认)。

# Structured context manager configuration.
# Window size is auto-discovered: leave max_tokens/target_tokens/reserve_output
# empty (or 0) and Lcoder reads the model's context window from the model
# catalog (models.dev). To pin a window for a model the catalog does not know,
# declare it in models.yaml (context_window / budget) — that takes precedence.
# Set max_tokens here only to force a global override for every model.
context:
  # max_tokens: 128000     # leave empty = auto from model; set to force-override
  # target_tokens: 120000  # leave empty = derived as max_tokens * 0.9
  # reserve_output: 8192   # leave empty = default 8192
  static_ratio: 60         # target percentage for static/stable blocks
  min_recent: 10           # minimum recent messages to keep
  keep_recent_tokens: 20000  # 压缩时保留尾部的 token 预算(proactive 档);preflight 减半、reactive 取 1/5
  compact_threshold: 0.9   # compact when usage reaches this ratio of target_tokens
  cache_hint_policy: default  # default | aggressive | none

# Persistent memory. Lcoder loads ~/.lcoder/memory/{MEMORY,USER}.md and
# <repo>/.lcoder/memory/{MEMORY,USER}.md into the system prompt.
# The memory tool writes to the global files only.
memory:
  enabled: true
  dynamic_recall: true        # per-turn relevance recall; set false for static snapshot
  recall_max_tokens: 1024     # token budget for recalled memory each turn
  recall_min_score: 0.1       # minimum relevance score (0..1) for an entry to be recalled
  # memory_char_limit: 2200
  # user_char_limit: 1375
  # External memory providers (Hermes-style). Currently only "http" is supported.
  # providers:
  #   - name: hermes-http
  #     type: http
  #     config:
  #       endpoint: "http://localhost:8000"
  #       api_key: "{env:HERMES_MEMORY_API_KEY}"
  #       timeout: 10
  #       search_path: "/search"
  #       observe_path: "/observe"
  #       session_end_path: "/session/end"

# Repository-level code indexing. When enabled, `repo_index` can search the
# codebase and inject symbol stubs into the context. Auto-inject runs on every
# user turn using the first sentence of the user message as the query.
# code_index:
#   enabled: true
#   auto_inject: false
#   max_results: 10
#   max_tokens: 8192
#   languages: [go, python, javascript, typescript]
#   exclude: ["vendor/", "node_modules/", "**/*_test.go"]

permissions:
  # Set unsafe_mode: true to bypass the permission engine for the current run.
  # Ultra-destructive commands (e.g. "rm -rf /") still require approval.
  # This can also be enabled per-run with the --unsafe CLI flag.
  unsafe_mode: false

  # Rules can be set to allow, ask, or deny. More specific patterns win over
  # generic ones. When a command is approved via the TUI/CLI as "project" or
  # "global", a matching rule is automatically written to:
  #   project:  <repo>/.lcoder/permissions.yaml
  #   global:   ~/.lcoder/permissions/global.yaml
  rules:
    read:
      "*": allow
    write:
      "*": ask
    edit:
      "*": ask
    ls:
      "*": allow
    grep:
      "*": allow
    find:
      "*": allow
    bash:
      "*": ask
      # Read-only / safe commands are allowed without prompting.
      "ls": allow
      "ls *": allow
      "pwd": allow
      "echo *": allow
      "which *": allow
      "whoami": allow
      "date": allow
      "git status": allow
      "git status *": allow
      "git log": allow
      "git log *": allow
      "git diff": allow
      "git diff *": allow
      "git branch": allow
      "git branch *": allow
      "git remote -v": allow
      "git stash list": allow
      # Dangerous commands are always denied.
      "rm -rf /": deny
      "rm -rf /*": deny
      "sudo *": deny
      "su *": deny
      "mkfs.*": deny
      "fdisk *": deny
      "dd": deny
      "dd *": deny
      "chmod -R 777 /": deny
      "chmod -R 777 /*": deny
      "chown -R root /": deny
      "chown -R root /*": deny
      "reboot": deny
      "shutdown *": deny
      "halt": deny
      ":(){ :|:& };:": deny

