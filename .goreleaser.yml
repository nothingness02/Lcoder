# GoReleaser 多平台发布配置。
# 触发方式：git tag v1.0.0 && git push origin v1.0.0
# 产物上传到 GitHub Releases，供 install.sh 下载。

version: 2

project_name: lcoder

before:
  hooks:
    - go mod tidy

builds:
  - id: lcoder
    main: ./cmd/lcoder
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}
      - -X main.Commit={{.Commit}}
      - -X main.BuildDate={{.Date}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    # 静态二进制：无外部依赖，单文件分发。

archives:
  - id: lcoder
    formats:
      - tar.gz
      - zip
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: nothingness02
    name: lcoder
  # 让 install.sh 能用 latest 版本号直接下载
  prerelease: auto
