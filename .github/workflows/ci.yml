name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.4"
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -count=1 -race -timeout 300s

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.4"
      - name: Build extension-hook
        run: cd examples/extension-hook && go build ./...
      - name: Build extension-exporter
        run: cd examples/extension-exporter && go build ./...
      - name: Build extension-http-tool
        run: cd examples/extension-http-tool && go build ./...
      - name: Build extension-mode
        run: cd examples/extension-mode && go build ./...
